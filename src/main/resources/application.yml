server:
  port: 8091

spring:
  application:
    name: mcp-weather
  ai:
    mcp:
      server:
        name: mcp-weather
        version: 0.1.0
        type: sync
        protocol: streamable
        streamable-http:
          mcp-endpoint: /mcp
        instructions: 오늘 날씨와 16일 안쪽 날짜별 예보 데이터를 돌려주는 서버입니다. 판단은 하지 않고 숫자와 참고값만 줍니다.
  cache:
    cache-names: weatherToday,weatherForecast
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=30m

weather:
  open-meteo:
    base-url: https://api.open-meteo.com
    timeout: 3s   # 한 번에 기다리는 시간. 끊기면 두 번 더 묻고, 늦으면 바로 MET Norway(OpenMeteoClient)
  met-no:         # Open-Meteo가 안 될 때 대신 묻는 곳(MET Norway, 키 없음)
    base-url: https://api.met.no
    timeout: 4s
  fallback:
    skip-for: 5m  # Open-Meteo가 실패하면 이 동안은 바로 MET Norway

management:
  endpoints:
    web:
      exposure:
        include: health
